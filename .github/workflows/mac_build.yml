name: Compilazione Mac (Apple Silicon)

on:
  push:
    branches: [ "main" ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: 📥 Scarica il codice dal tuo caveau
      uses: actions/checkout@v4
    
    - name: ⚙️ Installa Rust sul Mac virtuale
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin
        
    - name: 🚀 Compila il motore J-RAY PRO
      run: cargo build --release --target aarch64-apple-darwin
      
    - name: 📦 Prepara il file per il download
      uses: actions/upload-artifact@v4
      with:
        name: J-RAY-PRO-Mac-Silicon
        path: target/aarch64-apple-darwin/release/j-ray-pro