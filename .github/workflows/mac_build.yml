name: Build & Release J-RAY PRO

# 🛑 Parte SOLO quando crei un tag (es. v1.0.0, v1.1.2, ecc.)
on:
  push:
    tags:
      - 'v*'

jobs:
  # 🪟 COMPILAZIONE WINDOWS
  build-windows:
    name: 🪟 Build Windows
    runs-on: windows-latest
    steps:
    - name: 📥 Checkout Codice
      uses: actions/checkout@v4
    
    - name: ⚙️ Installa Rust
      uses: dtolnay/rust-toolchain@stable
        
    - name: 🚀 Compila il motore
      run: cargo build --release
      
    - name: 🏷️ Rinomina file con Versione
      shell: bash
      run: mv target/release/j-ray-pro.exe J-RAY-PRO-Windows-${{ github.ref_name }}.exe
      
    - name: 📦 Prepara Artifact finale
      uses: actions/upload-artifact@v4
      with:
        name: J-RAY-PRO-Windows-${{ github.ref_name }}
        path: J-RAY-PRO-Windows-${{ github.ref_name }}.exe

  # 🍎 COMPILAZIONE MAC (Apple Silicon)
  build-mac:
    name: 🍏 Build macOS
    runs-on: macos-latest
    steps:
    - name: 📥 Checkout Codice
      uses: actions/checkout@v4
    
    - name: ⚙️ Installa Rust (Target Silicon)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin
        
    - name: 🚀 Compila il motore
      run: cargo build --release --target aarch64-apple-darwin

    - name: 🏷️ Rinomina file con Versione
      run: mv target/aarch64-apple-darwin/release/j-ray-pro J-RAY-PRO-macOS-Silicon-${{ github.ref_name }}
      
    - name: 📦 Prepara Artifact finale
      uses: actions/upload-artifact@v4
      with:
        name: J-RAY-PRO-macOS-Silicon-${{ github.ref_name }}
        path: J-RAY-PRO-macOS-Silicon-${{ github.ref_name }}

  # 🐧 COMPILAZIONE LINUX (Ubuntu)
  build-linux:
    name: 🐧 Build Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Codice
      uses: actions/checkout@v4

    - name: 🛠️ Installa dipendenze grafiche OS
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config fontconfig libfontconfig1-dev
    
    - name: ⚙️ Installa Rust
      uses: dtolnay/rust-toolchain@stable
        
    - name: 🚀 Compila il motore
      run: cargo build --release

    - name: 🏷️ Rinomina file con Versione
      run: mv target/release/j-ray-pro J-RAY-PRO-Linux-${{ github.ref_name }}
      
    - name: 📦 Prepara Artifact finale
      uses: actions/upload-artifact@v4
      with:
        name: J-RAY-PRO-Linux-${{ github.ref_name }}
        path: J-RAY-PRO-Linux-${{ github.ref_name }}